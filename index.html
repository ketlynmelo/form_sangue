<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doação de sangue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

       
        <form id="formulario">  

            <h3>Cadastro</h3>

            <div class="div">
                <label for="Nome">Nome:</label>
                <input type="text" id="nome" placeholder="Nome" >
                <div id="erroNome" class="erro"></div>
            </div>
            

            <div class="div">
            <label for="Email">Email:</label>
                <input type="email" id="email" placeholder="Email">
                <div id="erroEmail" class="erro"></div>
            </div>

            <div class="div">
                <label for="Idade">Idade:</label>
                <input type="number" id="idade" placeholder="Idade">
                <div id="erroIdade" class="erro"></div>

            </div>
            

            <div class="div">
                <label for="Peso">Peso:</label>
                <input type="number" id="peso" placeholder="Peso">
                <div id="erroPeso" class="erro"></div>
            </div>
            

             <div class="div">
                <label for="tipo_sangue">Tipo sanguíneo:</label>
                <select name="tipo_sangue" id="tipo_sangue">
                    <option value="Selecione">Selecione</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                <div id="errotipo_sangue" class="erro"></div>
             </div>
            
             <div class="div">
                <label for="Telefone">Telefone:</label>
                <input type="number" id="telefone" placeholder="Telefone">
                <div id="erroTelefone" class="erro"></div>
             </div>
            
                
             <div class="div">
                <label for="Cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Cidade">
                <div id="erroCidade" class="erro"></div>
             </div>
            

             <div class="div">
                <label for="Estado">Estado:</label>
                <input type="text" id="estado" placeholder="Estado">
                <div id="erroEstado" class="erro"></div>
             </div>
            

            <button type="submit">Enviar</button>

        </form>

        <div class="resultado" id="resultado"></div>

    
    </div>

    
        
    </main>

    
    <script src="java.js"></script>

    
</body>
</html>
